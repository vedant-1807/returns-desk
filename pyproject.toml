[project]
name = "returns-desk"
version = "0.1.0"
description = "Multi-tenant returns support: an AI agent explains, deterministic services decide and move money."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "tzdata>=2024.1",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "mcp>=2.3.0",
    "httpx2>=2.16.2",
]

[project.scripts]
returns-desk = "returns_desk.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/returns_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "acceptance: release acceptance tests A01 to A16 from the functional spec",
    "seed(name): load this named fixture instead of two_jackets",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
