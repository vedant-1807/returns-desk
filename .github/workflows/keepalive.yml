name: keepalive

# Free tiers sleep. Render spins a free service down after about 15 minutes without
# traffic, and Supabase pauses a free project after about a week without activity. One
# request every 10 minutes to the deep health check keeps both awake: it reaches the API
# and makes the API run a query.
#
# Set the repository variable API_URL (Settings > Secrets and variables > Actions >
# Variables) to the deployed API's address. Without it this workflow does nothing.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the deep health check
        if: ${{ vars.API_URL != '' }}
        run: |
          curl --silent --show-error --fail --max-time 120 --retry 2 --retry-delay 20 \
            "${API_URL%/}/healthz?deep=1"
        env:
          API_URL: ${{ vars.API_URL }}
