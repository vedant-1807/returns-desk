# Local Postgres with pgvector. Matches what Supabase gives us in production.
# Port 54329 avoids clashing with any Postgres already on this machine.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: returns_desk
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d returns_desk"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - returns_desk_pg:/var/lib/postgresql/data

volumes:
  returns_desk_pg:
